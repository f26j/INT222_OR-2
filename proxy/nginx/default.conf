upstream fe_proxy {
    server frontend:3000;
}

upstream be_proxy {
    server backend:8080;
}

server {
    listen 80;
    listen [::]:80;

    # Reverse proxy
    location /api/ {
        proxy_pass http://be_proxy/;
    }

    # Reverse proxy
    location / {
        proxy_pass http://fe_proxy/;
    }
}
