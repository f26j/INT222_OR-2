upstream fe-proxy {
    server frontend:3000;
}

upstream be-proxy {
    server backend:8080;
}

server {
    listen 80;
    listen [::]:80;

    # Reverse proxy
    location /api/ {
        proxy_pass http://be-proxy/;
    }

    # Reverse proxy
    location / {
        proxy_pass http://fe-proxy/;
    }
}
