server {
    listen       80;
    server_name  ip23or2.sit.kmutt.ac.th;

    root   /usr/share/nginx/html;
    index  index.html index.htm;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Reverse proxy
    location /or2/ {
        proxy_pass http://intproj23.sit.kmutt.ac.th/or2/;
    }
}
