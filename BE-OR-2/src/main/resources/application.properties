spring.application.name=BE-OR-2

# Spring Boot Basic Configuration
spring.jpa.hibernate.ddl-auto=none
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.devtools.restart.enabled=true
server.servlet.context-path=/api
spring.profiles.active=prod

# Swagger UI (Local Testing)
springdoc.swagger-ui.enabled=true
springdoc.api-docs.enabled=true

# MySQL itbkk_v2 DB1 Configuration
db1.spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
db1.spring.datasource.username=${MYSQL_USER:root}
db1.spring.datasource.password=${MYSQL_PASSWORD:mysql@sit}
db1.spring.datasource.url=jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/itbkk_v3?serverTimezone=UTC&useLegacyDatetimeCode=false
db1.spring.datasource.jdbc-url=${db1.spring.datasource.url}

# MySQL itbkk_shared DB2 Configuration (Local Testing)
db2.spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
db2.spring.datasource.username=root
db2.spring.datasource.password=mysql@sit
db2.spring.datasource.url=jdbc:mysql://localhost:3306/itbkk_shared
db2.spring.datasource.jdbc-url=${db2.spring.datasource.url}

# Timezone Configuration
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jackson.time-zone=UTC

# Error Configuration
server.error.include-stacktrace=ON_PARAM
server.error.include-message=always

# JWT Configuration
jwt.secret.key=6512e36233da8c499ca67ec78c08a06adb0882f9ab57c624250e2f4b5fa9f62b
jwt.expiration.time=180000099999999999  
