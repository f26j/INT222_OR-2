version: "3.8"
services:
  mysql-db1:
    container_name: mysql-db1
    image: mysql/mysql-server
    restart: always
    ports:
      - "3306:3306"
    volumes:
      - ./database:/docker-entrypoint-initdb.d
    environment:
      - MYSQL_DATABASE=itbkk_v2
      - MYSQL_USER=root
      - MYSQL_ROOT_PASSWORD=mysql@sit
      - MYSQL_PASSWORD=mysql@sit
      - LANG=C.UTF-8
    command: ["mysqld", "--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]

  mysql-db2:
    container_name: mysql-db2
    image: mysql/mysql-server
    restart: always
    ports:
      - "3307:3306"
    environment:
      - MYSQL_DATABASE=itbkk_shared
      - MYSQL_USER=authuser
      - MYSQL_ROOT_PASSWORD=VT4eTSRo
      - MYSQL_PASSWORD=VT4eTSRo
      - LANG=C.UTF-8
    command: ["mysqld", "--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]

  spring-api:
    container_name: spring-api
    image: spring-boot
    restart: always
    build: .
    ports:
      - "8080:8080"
    environment:
      - MYSQL_HOST=mysql-db1
      - MYSQL_USER=root
      - MYSQL_PASSWORD=mysql@sit
      - MYSQL_PORT=3306
    depends_on:
      - mysql-db1
      - mysql-db2
