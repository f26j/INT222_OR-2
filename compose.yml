services:
  database:
    container_name: database
    image: mysql/mysql-server
    restart: always
    ports:
      - "3306:3306"
    volumes:
      - ./DB-OR-2:/docker-entrypoint-initdb.d
    environment:
      - MYSQL_DATABASE=itbkk_v3
      - MYSQL_USER=root
      - MYSQL_ROOT_PASSWORD=mysql@sit
      - MYSQL_PASSWORD=mysql@sit
      - LANG=C.UTF-8
    command: ["mysqld", "--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    networks:
      - or2

  backend:
    container_name: backend
    image: spring-boot
    restart: always
    build: ./BE-OR-2
    ports:
      - "8080:8080"
    environment:
      - MYSQL_HOST=database
      - MYSQL_USER=root
      - MYSQL_PASSWORD=mysql@sit
      - MYSQL_PORT=3306
    depends_on:
      - database
    networks:
      - or2

  frontend:
    container_name: frontend
    image: vue-js
    restart: always
    build: ./FE-OR-2
    ports:
      - "3000:80"
    networks:
      - or2

  proxy:
    container_name: proxy
    image: nginx:stable-alpine
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./proxy/nginx/default.conf:/etc/nginx/conf.d/default.conf
      - ./proxy/nginx/ssl:/etc/nginx/ssl
    depends_on:
      - backend
      - frontend
    networks:
      - or2

networks:
  or2:
    driver: bridge
